server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    # The browser only ever sees this origin; nginx reaches the api service by its Compose name.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://api:8000;
    }
}
